services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_MS: ${KAFKA_RETENTION_MS:-864000000}
      KAFKA_LOG_SEGMENT_MS: 3600000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-content-changes}
      KAFKA_RETENTION_MS: ${KAFKA_RETENTION_MS:-864000000}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$KAFKA_TOPIC" --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --entity-type topics --entity-name "$$KAFKA_TOPIC" --alter --add-config "retention.ms=$$KAFKA_RETENTION_MS,cleanup.policy=delete,segment.ms=3600000,retention.bytes=-1"

  mongodb:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  history-postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-revex_history}
      POSTGRES_USER: ${POSTGRES_USER:-revex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - content-history-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      REVEX_ADMIN_PASSWORD: ${REVEX_ADMIN_PASSWORD:?Set REVEX_ADMIN_PASSWORD in .env}
      REVEX_USER_PASSWORD: ${REVEX_USER_PASSWORD:?Set REVEX_USER_PASSWORD in .env}
      REVEX_MODERATOR_PASSWORD: ${REVEX_MODERATOR_PASSWORD:?Set REVEX_MODERATOR_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./Keycloak/revex-realm.json:/opt/keycloak/data/import/revex-realm.json:ro
      - ./Keycloak/themes:/opt/keycloak/themes:ro
    restart: unless-stopped

  revex-api:
    build:
      context: ..
      dockerfile: RevEx.Web/Backend/RevEx/RevEx.Api/Dockerfile
    ports:
      - "8082:8080"
    environment:
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      Kafka__Topic: ${KAFKA_TOPIC:-content-changes}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Authentication__Provider: Keycloak
      Authentication__Providers__Keycloak__Authority: http://localhost:8081/realms/revex
      Authentication__Providers__Keycloak__MetadataAddress: http://keycloak:8080/realms/revex/.well-known/openid-configuration
      Authentication__Providers__Keycloak__Audience: revex-api
      Authentication__Providers__Keycloak__RequireHttpsMetadata: "false"
      MongoDb__ConnectionString: mongodb://mongodb:27017
      MongoDb__DatabaseName: revex
      ContentHistory__ConnectionString: Host=history-postgres;Port=5432;Database=${POSTGRES_DB:-revex_history};Username=${POSTGRES_USER:-revex};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FileStorage__Provider: NetworkFolder
      FileStorage__NetworkFolder__Path: /app/storage/files
      DesktopReleases__Path: /app/storage/desktop-releases
    volumes:
      - revex-files:/app/storage/files
      - desktop-releases:/app/storage/desktop-releases
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      mongodb:
        condition: service_healthy
      history-postgres:
        condition: service_healthy
    restart: unless-stopped

  revex-frontend:
    build:
      context: ./Frontend
    ports:
      - "3000:80"
    depends_on:
      - revex-api
    restart: unless-stopped

volumes:
  kafka-data:
  mongodb-data:
  content-history-data:
  revex-files:
  desktop-releases:
